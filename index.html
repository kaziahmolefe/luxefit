<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LuxeFit</title>
<style>
:root{--bg:#fbf7f8;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--ac:#f2b8c6;--ac2:#d9778f;--ln:#eee4e7;--ok:#34a874;--er:#d64560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141012;--card:#1f1a1c;--tx:#f5f0f1;--mu:#9a9094;--ln:#322a2d;--ac:#c98a9c;--ac2:#f2b8c6}}
:root[data-theme="dark"]{--bg:#141012;--card:#1f1a1c;--tx:#f5f0f1;--mu:#9a9094;--ln:#322a2d;--ac:#c98a9c;--ac2:#f2b8c6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"New York","Iowan Old Style",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0 0 .4em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.logo{font-family:Georgia,serif;font-size:20px}.logo b{color:var(--ac2)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}nav button{white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:6px 16px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 24px rgba(217,119,143,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button{font:inherit;border:0;border-radius:980px;padding:9px 16px;background:var(--ln);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#3a1620;font-weight:600}button.p:hover{background:var(--ac2);color:#fff}
button.t.on{background:var(--tx);color:var(--bg)}button.sm{padding:5px 11px;font-size:13px}button.g{background:none;color:var(--ac2)}
input,select,textarea{width:100%;font:inherit;padding:11px 14px;margin:5px 0 10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
label{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.mu{color:var(--mu);font-size:13px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac);color:#3a1620;font-size:12px;margin:2px}
.warn{border-left:4px solid var(--er)}.ok{border-left:4px solid var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.lock{opacity:.6}.big{font-size:34px;font-family:Georgia,serif}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);z-index:20;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:12px 16px;border-radius:14px;background:var(--tx);color:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.2)}.toast.e{background:var(--er);color:#fff}.toast.s{background:var(--ok);color:#fff}
#bot{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9}
#botp{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(92vw,340px);z-index:9;display:none}
.lk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--ac)}.msg{padding:6px 0;border-bottom:1px solid var(--ln)}.scroll{max-height:260px;overflow:auto}
.auth{max-width:400px;margin:8vh auto;padding:0 18px;text-align:center}.auth .card{text-align:left}
</style></head><body>
<div id="toasts"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TR=[{n:'Amara K.',km:3,sp:['lose','tone'],r:350,v:1,rt:4.9},{n:'Johan P.',km:7,sp:['gain','strength'],r:420,v:0,rt:4.7},{n:'Naledi M.',km:12,sp:['lose','gain','yoga'],r:300,v:1,rt:4.8}];
const GYM=[{n:'Pulse Studio',km:4},{n:'Iron & Lace Gym',km:9},{n:'Aura Fitness',km:14}];
const PRG=[{n:'4-Week Starter',p:0,d:'3 days/week full body'},{n:'Glute & Core Sculpt',p:0,d:'Home-friendly, 20 min'},{n:'12-Week Transformation',p:1,d:'Periodised plan + check-ins'},{n:'Strength Foundations Pro',p:1,d:'Progressive overload tracker'}];
const BAD=['idiot','stupid','hate you','scam','fuck','shit','bitch'];
function init(){return{users:[{id:1,name:'Admin',email:'admin@luxefit.app',pw:'admin123',role:'admin',prem:1,ver:'approved',p:{}}],me:null,view:'home',as:null,posts:[{id:1,uid:1,txt:'Welcome to LuxeFit. Share your journey ✨',likes:[],cm:[],rp:0}],fol:{},chat:[{u:'LuxeFit',t:'Welcome to the live room. Keep it kind.'}],tickets:[],reports:[],cart:[],w:{},bk:[],jobs:[{id:1,t:'Fat-loss coach needed (virtual ok)',by:'Trainee',fee:350,ap:[]}],arts:[],prods:[{id:1,n:'LuxeFit Resistance Bands',pr:299},{id:2,n:'Whey Protein 1kg',pr:549}],eng:{},strikes:{},ev:[],sess:[],slots:[]}}
let S;try{S=JSON.parse(localStorage.getItem('lf'))||init()}catch(e){S=init()}
S.bill=S.bill||[];S.msgs=S.msgs||[];const save=()=>{try{localStorage.setItem('lf',JSON.stringify(S))}catch(e){}};
const U=()=>S.users.find(u=>u.id===S.me),uid=id=>S.users.find(u=>u.id===id)||{name:'User'};
const role=()=>S.as||U().role;
function toast(m,t=''){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3800)}
function pts(n,why){const u=U();S.eng[u.id]=(S.eng[u.id]||0)+n;save()}
const lvl=p=>p>=100?'Icon 💎':p>=50?'Creator ✨':p>=15?'Rising 🌸':'Newcomer';
const v=id=>($('#'+id)||{}).value;
function go(x){S.view=x;save();R()}
/* AUTH */
function authV(){return`<div class="auth"><h1 class="logo" style="font-size:38px">Luxe<b>Fit</b></h1><p class="mu">Train beautifully. Connect. Grow.</p><div class="card"><label>Name</label><input id="an"><label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap" type="password"><label>I am a</label><select id="ar"><option value="trainee">Trainee</option><option value="trainer">Trainer</option><option value="business">Fitness business</option></select><div class="row"><button class="p" onclick="signup()">Create account</button><button onclick="login()">Log in</button></div><p class="mu">Admin demo: admin@luxefit.app / admin123 (change before launch)</p></div></div>`}
function signup(){const n=v('an').trim(),e=v('ae').trim().toLowerCase(),p=v('ap');
if(!n)return toast('Please enter your name.','e');if(!/^\S+@\S+\.\S+$/.test(e))return toast('That email address doesn’t look right.','e');if(p.length<8)return toast('Password must be at least 8 characters.','e');if(S.users.some(u=>u.email===e))return toast('An account with this email already exists. Try logging in.','e');
const u={id:Date.now(),name:n,email:e,pw:p,role:v('ar'),prem:0,ver:'none',p:{}};S.users.push(u);S.me=u.id;S.view='home';save();R();toast('Welcome, '+n+' 🌸','s')}
function login(){const u=S.users.find(u=>u.email===v('ae').trim().toLowerCase()&&u.pw===v('ap'));if(!u)return toast('Incorrect email or password.','e');S.me=u.id;S.view='home';save();R()}
function logout(){S.me=null;S.as=null;save();R()}
/* NAV */
const NAV={trainee:['home','diet','progress','programs','book','dm','shop','feed','net','chat'],trainer:['home','profile','schedule','dm','jobs','articles','feed','net','chat'],business:['home','profile','jobs','promo','shop','dm','feed','net']};
const LB={home:'Home',diet:'Nutrition',progress:'Progress',programs:'Programs',book:'Book',shop:'Shop',feed:'Community',chat:'Live Chat',profile:'Profile',dm:'Messages',net:'Network',billing:'Billing',schedule:'Schedule',jobs:'Jobs',articles:'Articles',promo:'Promotions',admin:'Admin'};
function R(){if(!S.me){$('#app').innerHTML=authV();return}
const u=U(),r=role(),nv=(u.role==='admin'?['admin']:[]).concat(NAV[r]||NAV.trainee);
$('#app').innerHTML=`<header><span class="logo">Luxe<b>Fit</b></span><span>${u.prem?'<span class="pill">Premium</span>':'<button class="sm p" onclick="go(\'premium\')">Go Premium</button>'} <button class="sm g" onclick="go('billing')">Billing</button> <button class="sm g" onclick="logout()">Log out</button></span></header>
${u.role==='admin'?`<nav>${['trainee','trainer','business'].map(x=>`<button class="sm t ${r===x?'on':''}" onclick="S.as='${x}';go('home')">${x} portal</button>`).join('')}</nav>`:''}
<nav>${nv.map(x=>`<button class="t ${S.view===x?'on':''}" onclick="go('${x}')">${LB[x]||x}</button>`).join('')}</nav>
<main>${(V[S.view]||V.home)()}</main><button id="bot" class="p" onclick="$('#botp').style.display=$('#botp').style.display==='block'?'none':'block'">💬 Help</button><div id="botp" class="card"><b>Support assistant</b><div id="bl" class="scroll mu">Hi! Ask about billing, verification, bookings or login. I’ll log a ticket if I can’t solve it.</div><input id="bi" placeholder="Type your question" onkeydown="if(event.key==='Enter')ask()"><button class="p sm" onclick="ask()">Send</button></div>`}
const lock=(t)=>`<div class="card lock"><h3>🔒 ${t}</h3><p class="mu">Premium feature.</p><button class="p" onclick="go('premium')">Unlock</button></div>`;
const V={
home(){const u=U(),r=role(),e=S.eng[u.id]||0,wl=S.w[u.id]||[];
let h=`<h1>Hello, ${esc(u.name.split(' ')[0])}</h1><p class="mu">${r==='trainee'?'Your wellness hub':r==='trainer'?'Your coaching studio':'Your business hub'}</p>
<div class="card"><div class="row"><div><label>Engagement</label><div class="big">${e} pts</div><span class="pill">${lvl(e)}</span></div><div class="mu" style="max-width:260px">Post, comment, chat and log progress to level up. Top creators get featured.</div></div></div>`;
if(r==='trainee'){const w=warn(u.id);h+=w?`<div class="card warn"><b>⚠️ Weight alert</b><br>${w}</div>`:`<div class="card ok">✅ No weight warnings. Keep going!</div>`;h+=`<div class="grid"><div class="card"><h3>Log today’s weight</h3><button onclick="go('progress')">Open tracker</button></div><div class="card"><h3>Find a coach</h3><button onclick="go('book')">Book a session</button></div></div>`}
if(r==='trainer')h+=`<div class="grid"><div class="card"><h3>Clients</h3><div class="big">${S.bk.filter(b=>b.t===u.name).length}</div></div><div class="card"><h3>Verification</h3><span class="pill">${u.ver}</span></div><div class="card"><h3>Rating</h3><div class="big">${u.p.rt||'New'}</div></div></div>`;
if(r==='business')h+=`<div class="grid"><div class="card"><h3>Verification</h3><span class="pill">${u.ver}</span></div><div class="card"><h3>Open roles</h3><div class="big">${S.jobs.filter(j=>j.by===u.name).length}</div></div></div>`;
return h},
diet(){const u=U(),p=u.p;let h=`<h1>AI nutrition</h1><div class="card"><div class="grid"><div><label>Goal</label><select id="dg"><option value="lose">Lose fat</option><option value="gain">Build muscle</option><option value="maintain">Maintain</option></select></div><div><label>Sex</label><select id="ds"><option>female</option><option>male</option></select></div><div><label>Age</label><input id="da" type="number" value="${p.age||28}"></div><div><label>Height cm</label><input id="dh" type="number" value="${p.h||168}"></div><div style='grid-column:1/-1'><label>Health status (optional, private)</label><br>${['Cancer / in treatment','Shortness of breath','PMS','Diabetes','Heart condition'].map(x=>`<label style='text-transform:none;margin-right:10px'><input type='checkbox' class='hc' value='${x}' style='width:auto;margin:0 4px 0 0' ${(p.hs||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div><div><label>Last period start (if applicable)</label><input id='lp' type='date' value='${p.lp||''}'></div><div><label>Cycle length (days)</label><input id='cl' type='number' value='${p.cl||28}'></div><div><label>Weight kg</label><input id="dw" type="number" value="${p.w||70}"></div></div><button class="p" onclick="diet()">Generate plan</button></div><div id="dout">${p.diet||''}</div>`;return h},
progress(){const u=U(),l=S.w[u.id]||[],wr=warn(u.id);const mx=Math.max(...l.map(x=>x.k),1),mn=Math.min(...l.map(x=>x.k),mx);
return`<h1>Progress</h1><div class="card"><div class="row"><input id='pw' type='number' step='.1' placeholder='Weight kg' style='max-width:130px'><input id='pwa' type='number' placeholder='Waist cm' style='max-width:120px'><input id='pbf' type='number' placeholder='Body fat %' style='max-width:120px'><select id='pen' style='max-width:130px'><option value=''>Energy</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><button class="p" onclick="logW()">Log</button></div>${wr?`<p style="color:var(--er)">⚠️ ${wr}</p>`:''}
<div style="display:flex;align-items:flex-end;gap:6px;height:120px">${l.slice(-12).map(x=>`<div title="${x.k}kg" style="flex:1;background:var(--ac);border-radius:6px 6px 0 0;height:${20+80*(x.k-mn)/Math.max(mx-mn,1)}px"></div>`).join('')||'<span class="mu">No entries yet.</span>'}</div></div>${(()=>{const a=l[0],b=l[l.length-1];if(!b)return'';const hh=(u.p.h||168)/100,d=k=>(a[k]==null||b[k]==null)?'—':(b[k]-a[k]>0?'+':'')+(b[k]-a[k]).toFixed(1),c=(t,x)=>`<div class='card'><label>${t}</label><div class='big'>${x}</div></div>`;return `<div class='grid'>${c('BMI',(b.k/(hh*hh)).toFixed(1))}${c('Weight change',d('k')+' kg')}${c('Entries',l.length)}</div>`+(u.prem?`<div class='grid'>${c('Waist change',d('wa')+' cm')}${c('Body fat change',d('bf')+' %')}${c('Energy',b.en||'—')}</div>`:lock('Waist, body-fat and energy analytics'))})()}`},
programs(){const u=U();return`<h1>Training programs</h1>${active()}<div class="grid">${PRG.map(p=>p.p&&!u.prem?`<div class="card lock"><h3>🔒 ${p.n}</h3><p class="mu">${p.d}</p><button class="p sm" onclick="go('premium')">Premium</button></div>`:`<div class="card"><h3>${p.n}</h3><p class="mu">${p.d}</p><button class="p sm" onclick="startP('${p.n}')">Start</button></div>`).join('')}</div>`},
book(){const u=U();return`<h1>Book a session</h1><div class="card"><div class="grid"><div><label>Goal</label><select id="bg"><option value="lose">Lose fat</option><option value="gain">Build muscle</option><option value="tone">Tone</option></select></div><div><label>Max distance (km)</label><input id="bd" type="number" value="10"></div><div><label>Day</label><input id='bdy' type='date'></div><div><label>Time</label><input id='btm' type='time'></div><div><label>Virtual ok?</label><select id="bv"><option value="0">In person</option><option value="1">Virtual ok</option></select></div></div><button class="p" onclick="match()">Find my match</button></div><div id="bout"></div><h3>Your bookings</h3>${S.bk.filter(b=>b.u===u.id).map(b=>`<div class='card row'><div><b>${esc(b.t)}</b> · ${esc(b.g)}<br><span class='mu'>${esc(b.day||'')} ${esc(b.time||'')}</span> <span class='pill'>${b.st||'pending'}</span></div><button class='sm' onclick="openDM('${esc(b.t)}')">✉️ Message</button></div>`).join('')||'<p class="mu">None yet.</p>'}`},
shop(){const u=U(),r=role(),tot=S.cart.reduce((a,c)=>a+c.pr,0);return`<h1>Shop</h1><div class="grid">${S.prods.map(p=>`<div class="card"><h3>${esc(p.n)}</h3><div class="big" style="font-size:22px">R${p.pr}</div><button class="p sm" onclick="S.cart.push(S.prods.find(x=>x.id==${p.id}));save();R();toast('Added to cart','s')">Add to cart</button></div>`).join('')}</div>
<div class="card"><h3>Cart (${S.cart.length})</h3>${S.cart.map(c=>`<div class="msg">${esc(c.n)} — R${c.pr}</div>`).join('')}<div class="row"><b>Total R${tot}</b><span><button class="sm" onclick="S.cart=[];save();R()">Clear</button> <button class="p sm" onclick="checkout()">Checkout</button></span></div></div>
${r==='business'||r==='trainer'||U().role==='admin'?`<div class="card"><h3>List a product</h3><input id="pn" placeholder="Product / program name"><input id="pp" type="number" placeholder="Price R"><button class="p" onclick="addProd()">Publish</button></div>`:''}`},
profile(){const u=U(),p=u.p,r=role();return`<h1>${r==='business'?'Business profile':'Trainer profile'}</h1><div class="card"><label>${r==='business'?'Business name':'Display name'}</label><input id="f1" value="${esc(p.name||u.name)}"><label>${r==='business'?'Services':'Specialisations'}</label><input id="f2" value="${esc(p.sp||'')}" placeholder="e.g. weight loss, yoga">${r==='trainer'?`<label>Years of experience</label><input id="f3" type="number" value="${p.exp||''}"><label>Rate per session (R)</label><input id="f4" type="number" value="${p.rate||''}"><label>Virtual training</label><select id="f5"><option value="0">No</option><option value="1" ${p.virt==1?'selected':''}>Yes</option></select>`:''}<label>About</label><textarea id="f6">${esc(p.about||'')}</textarea><button class="p" onclick="saveProf()">Save profile</button></div>
<div class="card ${u.ver==='approved'?'ok':''}"><h3>Verification: <span class="pill">${u.ver}</span></h3><p class="mu">${r==='business'?'Upload business registration documents.':'Upload your ID and training certification.'} Reviewed by an admin.</p><input type="file" id="vf" multiple><button class="p" onclick="verify()">Submit for review</button></div>`},
schedule(){const u=U();return`<h1>Schedule</h1><div class="card"><div class="row"><input id="sd" type="datetime-local" style="max-width:240px"><button class="p" onclick="addSlot()">Add slot</button></div>${S.slots.filter(s=>s.u===u.id).map(s=>`<div class="msg">${esc(s.d.replace('T',' '))}</div>`).join('')||'<p class="mu">No slots.</p>'}</div><h3>Appointments &amp; reports</h3>${S.bk.filter(b=>b.t===u.name).map(b=>`<div class='card'>${esc(uid(b.u).name)} · ${esc(b.g)} · ${esc(b.day||'')} ${esc(b.time||'')} <span class='pill'>${b.st||'pending'}</span> <button class='sm p' onclick="setSt(${b.id},'approved')">Approve</button> <button class='sm' onclick="setSt(${b.id},'declined')">Decline</button> <button class='sm' onclick="openDM('${esc(uid(b.u).name)}')">✉️</button><textarea id="sr${b.u}" placeholder="Session report"></textarea><button class="sm p" onclick="S.sess.push({c:${b.u},t:v('sr${b.u}')});save();toast('Report saved','s')">Save report</button></div>`).join('')||'<p class="mu">No appointments yet.</p>'}`},
jobs(){const u=U(),r=role();return`<h1>${r==='business'?'Hiring':'Job board'}</h1>${r!=='trainer'?`<div class="card"><input id="jt" placeholder="${r==='business'?'Role title':'What do you need help with?'}"><input id="jf" type="number" placeholder="Budget R"><button class="p" onclick="addJob()">Post</button>${r==='business'?'<p class="mu">A 10% platform commission applies to successful hires.</p>':''}</div>`:''}${S.jobs.map(j=>`<div class="card"><div class="row"><div><b>${esc(j.t)}</b><br><span class="mu">by ${esc(j.by)} · R${j.fee} · ${j.ap.length} applicants</span></div>${r==='trainer'?`<button class="p sm" onclick="apply(${j.id})">Apply</button>`:''}</div></div>`).join('')}`},
articles(){const u=U();return`<h1>Articles</h1><div class="card"><input id="at" placeholder="Title"><textarea id="ab" placeholder="Share your advice"></textarea><button class="p" onclick="S.arts.push({a:U().name,t:v('at'),b:v('ab')});pts(5);save();R();toast('Published','s')">Publish</button></div>${S.arts.map(a=>`<div class="card"><h3>${esc(a.t)}</h3><p>${esc(a.b)}</p><span class="mu">${esc(a.a)}</span></div>`).join('')}`},
promo(){return`<h1>Events &amp; promotions</h1><div class="card"><textarea id="ev" placeholder="Announce an event or offer"></textarea><button class="p" onclick="promoPost()">Post</button></div>${S.ev.map(e=>`<div class="card"><b>${esc(e.b)}</b><p>${esc(e.t)}</p></div>`).join('')}`},
feed(){const u=U();return`<h1>Community</h1><div class="card"><textarea id="pt" placeholder="Share something…"></textarea><input id='pi' type='file' accept='image/*'><button class='p' onclick='post()'>Post</button></div>${S.posts.slice().reverse().map(p=>`<div class="card"><div class="row"><b class='lk' onclick='vp(${p.uid})'>${esc(uid(p.uid).name)}</b>${p.promo?` <span class='pill'>Promotion</span>`:''}${p.uid!==u.id?`<button class="sm" onclick="follow(${p.uid})">${(S.fol[u.id]||[]).includes(p.uid)?'Following':'Follow'}</button>`:''}</div><p>${esc(p.txt)}</p>${p.img?`<img src='${p.img}' alt='Post photo' style='width:100%;border-radius:14px'>`:''}<button class="sm" onclick="like(${p.id})">♥ ${p.likes.length}</button> <button class="sm" onclick="repost(${p.id})">↻ ${p.rp}</button><div>${p.cm.map(c=>`<div class="mu msg">${esc(c)}</div>`).join('')}</div><input id="c${p.id}" placeholder="Comment" onkeydown="if(event.key==='Enter')comment(${p.id})"></div>`).join('')}`},
